[package]
name = "circle-generator"
version = "0.2.0"
edition = "2021"
description = "Smooth circles for Brickadia, saved as prefabs"
license = "MIT"

[lib]
name = "circlegen"
path = "src/lib.rs"

[[bin]]
name = "CircleGenerator"
path = "src/main.rs"
required-features = ["gui"]

[[bin]]
name = "sweep"
path = "src/bin/sweep.rs"

[[bin]]
name = "testpack"
path = "src/bin/testpack.rs"

[features]
default = ["gui"]
gui = ["dep:eframe", "dep:egui", "dep:dirs"]

[dependencies]
brdb = "1.0.5"
eframe = { version = "0.33.3", optional = true }
egui = { version = "0.33.3", optional = true }
dirs = { version = "5", optional = true }

[target.'cfg(windows)'.dependencies]
clipboard-win = { version = "5.4.1", features = ["windows-win"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[[bin]]
name = "thin"
path = "src/bin/thin.rs"

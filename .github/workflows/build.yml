name: Build Windows .exe

# Runs on every push, and can be started by hand from the Actions tab
# ("Run workflow"). The finished CircleGenerator.exe appears as a download
# at the bottom of the run's page under "Artifacts".
# Pushing a version tag (e.g. v0.5.1) publishes a public Release
# with the .exe attached, so anyone can download it without an account.
# A Release can also be made from the Actions tab: "Run workflow" and type
# the version (e.g. v0.5.2) in "release_tag".
on:
  push:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a Release with this version tag (e.g. v0.5.2); leave empty for a normal build"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Self-test (gap / overlap check on 8,000+ layouts)
        run: cargo run --release --no-default-features --bin sweep -- 2 40 1
      - name: Cone self-test (overlap / size check on 20,000+ cone layouts)
        run: cargo run --release --no-default-features --bin conesweep -- 90
      - name: Shell self-test (joints, overlaps and sizes on 10,000+ shells)
        run: cargo run --release --no-default-features --bin shellsweep
      - name: Build the program
        run: cargo build --release --bin CircleGenerator
      - uses: actions/upload-artifact@v4
        with:
          name: CircleGenerator-windows
          path: target/release/CircleGenerator.exe
      - name: Publish a Release (version tags only)
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag != '' && inputs.release_tag || github.ref_name }}
        run: |
          Compress-Archive -Path target/release/CircleGenerator.exe -DestinationPath "CircleGenerator-$env:TAG-windows.zip"
          gh release create "$env:TAG" "CircleGenerator-$env:TAG-windows.zip" target/release/CircleGenerator.exe --target "${{ github.sha }}" --title "Circle Generator $env:TAG" --notes-file docs/RELEASE_NOTES.md
